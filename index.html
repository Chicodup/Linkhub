<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkHub: Моє ім'я</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="avatar">👤</div>

        <h1>Моє ім'я</h1>
        <p class="status">✨ Вітаю на моїй сторінці!</p>

        <p class="description">
            Тут зібрані всі мої соціальні мережі та контакти.
            Підписуйся та залишайся на зв'язку!
        </p>

        <div class="links">
            <a href="https://instagram.com/" target="_blank" class="btn">
                📸 Instagram
            </a>

            <a href="https://tiktok.com/" target="_blank" class="btn">
                🎵 TikTok
            </a>

            <a href="https://github.com/" target="_blank" class="btn">
                💻 GitHub
            </a>
        </div>

        <button id="themeButton">🌙 Змінити тему</button>

        <p class="footer">© 2026 LinkHub</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
